<body>

<header>

<a href="../index.html" class="logo">
  Numeroxa
  <span class="tagline">Smart Financial Calculators</span>
</a>

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<nav id="nav">
  <a href="../index.html">Home</a>
  <a href="au/mortgage-calculator.html">Mortgage</a>

  <a href="au/savings-goal.html">Savings</a>

</nav>

</header>

<div class="container">

<h1>Compare Mortgages</h1>

<div class="grid">

<div class="card">
<h3>Loan A</h3>
<input id="loan1" value="600000">
<input id="rate1" value="6">
<input id="years1" value="30">
<input id="extra1" value="0">

<div class="result">
<div class="big" id="monthly1"></div>
<div id="interest1"></div>
</div>
</div>

<div class="card">
<h3>Loan B</h3>
<input id="loan2" value="600000">
<input id="rate2" value="5.5">
<input id="years2" value="30">
<input id="extra2" value="0">

<div class="result">
<div class="big" id="monthly2"></div>
<div id="interest2"></div>
</div>
</div>

</div>

<div class="highlight" id="summary"></div>

</div>

<script>
let chart;
let amortData=[];

const loanEl = document.getElementById("loan");
const rateEl = document.getElementById("rate");
const yearsEl = document.getElementById("years");
const extraEl = document.getElementById("extra");

const monthlyEl = document.getElementById("monthly");
const interestEl = document.getElementById("interest");
const savedEl = document.getElementById("saved");
const durationEl = document.getElementById("duration");

const tableEl = document.getElementById("table");

function basePayment(P,r,n){
  if(r===0) return P/n;
  return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
}

function runLoan(P,r,n,extra){

  let balance=P;
  let totalInterest=0;
  let totalPrincipal=0;
  let months=0;

  let base=basePayment(P,r,n);

  let labels=[];
  let balanceSeries=[];
  let interestSeries=[];
  let principalSeries=[];

  let tableHTML="";
  amortData=[];

  while(balance>0 && months<1000*12){

    let interest=balance*r;
    let payment=base+extra;

    if(payment>balance+interest){
      payment=balance+interest;
    }

    let principal=payment-interest;

    balance-=principal;
    totalInterest+=interest;
    totalPrincipal+=principal;
    months++;

    amortData.push([months,payment,principal,interest,balance]);

    tableHTML+=`<tr>
<td>${months}</td>
<td>$${Math.round(payment).toLocaleString()}</td>
<td>$${Math.round(principal).toLocaleString()}</td>
<td>$${Math.round(interest).toLocaleString()}</td>
<td>$${Math.max(0,Math.round(balance)).toLocaleString()}</td>
</tr>`;

    if(months%12===0){
      labels.push("Year "+months/12);
      balanceSeries.push(balance);
      interestSeries.push(totalInterest);
      principalSeries.push(totalPrincipal);
    }
  }

  document.querySelector("#table tbody").innerHTML=tableHTML;

  return {
    totalInterest,
    months,
    base,
    labels,
    balanceSeries,
    interestSeries,
    principalSeries
  };
}

function calculate(){

  let P=+loanEl.value;
  let r=rateEl.value/100/12;
  let n=yearsEl.value*12;
  let extraVal=+extraEl.value||0;

  let normal=runLoan(P,r,n,0);
  let extraLoan=runLoan(P,r,n,extraVal);

  function f(x){return "$"+Math.round(x).toLocaleString();}

  monthlyEl.innerText=f(extraLoan.base+extraVal);
  interestEl.innerText=f(extraLoan.totalInterest);
  savedEl.innerText=f(normal.totalInterest-extraLoan.totalInterest);

  let y=Math.floor(extraLoan.months/12);
  let m=extraLoan.months%12;
  durationEl.innerText=y+"y "+m+"m";

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels:extraLoan.labels,
      datasets:[
        {label:"Remaining Balance",data:extraLoan.balanceSeries},
        {label:"Principal Paid",data:extraLoan.principalSeries},
        {label:"Interest Paid",data:extraLoan.interestSeries}
      ]
    },
    options:{
      responsive:true,
      interaction:{mode:"index",intersect:false}
    }
  });
}

function toggleTable(){
  tableEl.classList.toggle("hidden");
}

function downloadCSV(){
  let csv="Month,Payment,Principal,Interest,Balance\n";
  amortData.forEach(r=>csv+=r.join(",")+"\n");

  let blob=new Blob([csv]);
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="mortgage.csv";
  a.click();
}

document.querySelectorAll("input").forEach(i=>i.oninput=calculate);
calculate();

function toggleMenu(){
  document.getElementById("nav").classList.toggle("active");
}
</script>

</script>
</body>
