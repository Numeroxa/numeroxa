<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Savings Goal Calculator Australia (2026) | Numeroxa</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f9fafb;
      color: #111;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px 40px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .big {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .highlight {
      margin-top: 15px;
      padding: 15px;
      background: #fde68a;
      border-radius: 8px;
      font-weight: bold;
    }

    canvas {
      margin-top: 30px;
    }

    @media(max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  Numeroxa — Smart Financial Calculators
</header>

<div class="container">

  <h1>Savings Goal Calculator</h1>

  <div class="calculator">

    <div class="grid">
      <div>
        <label>Target Amount ($)</label>
        <input id="target" type="number" value="100000">
      </div>

      <div>
        <label>Current Savings ($)</label>
        <input id="current" type="number" value="10000">
      </div>

      <div>
        <label>Interest Rate (% p.a.)</label>
        <input id="rate" type="number" value="5" step="0.01">
      </div>

      <div>
        <label>Time Period (years)</label>
        <input id="years" type="number" value="10">
      </div>
    </div>

    <div class="result">
      <div>Required monthly saving</div>
      <div class="big" id="monthly"></div>

      <div>Total contributions</div>
      <div id="contributions"></div>

      <div>Interest earned</div>
      <div id="interest"></div>

      <div class="highlight" id="message"></div>
    </div>

    <canvas id="chart"></canvas>

  </div>

</div>

<script>
let chart;

function calculate() {
  let target = parseFloat(document.getElementById("target").value) || 0;
  let current = parseFloat(document.getElementById("current").value) || 0;
  let r = parseFloat(document.getElementById("rate").value) / 100 / 12;
  let years = parseFloat(document.getElementById("years").value);
  let n = years * 12;

  let monthly;

  if (r === 0) {
    monthly = (target - current) / n;
  } else {
    monthly = (target - current * Math.pow(1 + r, n)) /
              ((Math.pow(1 + r, n) - 1) / r);
  }

  monthly = Math.max(0, monthly);

  let balance = current;
  let totalContrib = current;

  let labels = [];
  let contribData = [];
  let interestData = [];

  for (let i = 0; i <= n; i++) {

    if (i % 12 === 0) {
      let interest = balance - totalContrib;

      labels.push("Year " + (i / 12));
      contribData.push(totalContrib);
      interestData.push(interest);
    }

    balance = balance * (1 + r) + monthly;
    totalContrib += monthly;
  }

  let contributions = totalContrib;
  let interest = balance - contributions;

  function format(x) {
    return "$" + Math.round(x).toLocaleString();
  }

  document.getElementById("monthly").innerText = format(monthly);
  document.getElementById("contributions").innerText = format(contributions);
  document.getElementById("interest").innerText = format(interest);

  document.getElementById("message").innerText =
    "To reach your goal, you need to save " + format(monthly) + " per month";

  renderChart(labels, contribData, interestData);
}

function renderChart(labels, contributions, interest) {
  const ctx = document.getElementById("chart").getContext("2d");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        {
          label: "Contributions",
          data: contributions,
          fill: true,
          borderWidth: 1
        },
        {
          label: "Interest",
          data: interest,
          fill: true,
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      interaction: {
        mode: "index",
        intersect: false
      },
      stacked: true,
      plugins: {
        legend: {
          position: "top"
        }
      },
      scales: {
        y: {
          stacked: true,
          ticks: {
            callback: value => "$" + value.toLocaleString()
          }
        }
      }
    }
  });
}

document.querySelectorAll("input").forEach(el => {
  el.addEventListener("input", calculate);
});

calculate();
</script>

</body>
</html>
