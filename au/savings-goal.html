<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Savings Goal Calculator | Numeroxa</title>
</head>

<body>

<h1>Savings Goal Calculator</h1>

<input id="target" value="100000">
<input id="current" value="10000">
<input id="rate" value="5">
<input id="years" value="10">

<div id="monthly"></div>

<!-- RELATED -->
<div style="margin-top:40px;background:#eef2ff;padding:20px;border-radius:10px;">
<strong>Related calculators:</strong>
<ul>
<li><a href="compound-interest.html">Compound interest</a></li>
<li><a href="mortgage-calculator.html">Mortgage</a></li>
<li><a href="tax-calculator.html">Tax</a></li>
</ul>
</div>

<section>
<h2>How to reach your savings goal</h2>
<p>Your required savings depend on time, returns, and your starting balance.</p>
</section>

<script>
function calc(){
let t=+target.value,c=+current.value,r=rate.value/100/12,n=years.value*12;
let m=(t-c*Math.pow(1+r,n))/((Math.pow(1+r,n)-1)/r);
monthly.innerText="$"+Math.round(m).toLocaleString();
}
document.querySelectorAll("input").forEach(i=>i.oninput=calc);
calc();
</script>

</body>
</html>
