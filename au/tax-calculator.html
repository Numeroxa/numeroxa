<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tax Calculator Australia | Numeroxa</title>
</head>

<body>

<h1>Tax Calculator</h1>

<input id="income" value="80000">
<select id="resident">
<option value="resident">Resident</option>
<option value="nonresident">Non-resident</option>
</select>

<div id="tax"></div>

<!-- RELATED -->
<div style="margin-top:40px;background:#eef2ff;padding:20px;border-radius:10px;">
<strong>Related calculators:</strong>
<ul>
<li><a href="mortgage-calculator.html">Mortgage</a></li>
<li><a href="compound-interest.html">Compound</a></li>
<li><a href="savings-goal.html">Savings</a></li>
</ul>
</div>

<section>
<h2>Australian tax explained</h2>
<p>Australia uses a progressive tax system where higher income is taxed at higher rates.</p>
</section>

<script>
function taxCalc(i,res){
if(res==="nonresident"){
if(i<=120000)return i*0.325;
if(i<=180000)return 39000+(i-120000)*0.37;
return 61200+(i-180000)*0.45;
}
if(i<=18200)return 0;
if(i<=45000)return (i-18200)*0.16;
if(i<=135000)return 4288+(i-45000)*0.30;
if(i<=190000)return 31288+(i-135000)*0.37;
return 51638+(i-190000)*0.45;
}

function calc(){
let i=+income.value,res=resident.value;
let t=taxCalc(i,res);
tax.innerText="$"+Math.round(t).toLocaleString();
}

document.querySelectorAll("input,select").forEach(e=>e.oninput=calc);
calc();
</script>

</body>
</html>
