<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Income Tax Calculator Australia (2026) | Numeroxa</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f9fafb;
      color: #111;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px 40px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .result {
      padding: 20px;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .big {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    canvas {
      margin-top: 30px;
    }

    @media(max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  Numeroxa — Smart Financial Calculators
</header>

<div class="container">

  <h1>Income Tax Calculator (Australia)</h1>

  <div class="calculator">

    <label>Annual Income ($)</label>
    <input id="income" type="number" value="80000">

    <div class="result">

      <div>Total tax</div>
      <div class="big" id="tax"></div>

      <div>Medicare levy</div>
      <div id="medicare"></div>

      <div>Total payable</div>
      <div id="total"></div>

      <div>Net income</div>
      <div id="net"></div>

      <div class="grid">
        <div>
          <div>Monthly take-home</div>
          <div id="monthly"></div>
        </div>
        <div>
          <div>Weekly take-home</div>
          <div id="weekly"></div>
        </div>
      </div>

      <div>Effective tax rate</div>
      <div id="rate"></div>

    </div>

    <canvas id="chart"></canvas>

  </div>

</div>

<script>
let chart;

function calculateTax(income) {
  if (income <= 18200) return 0;
  if (income <= 45000) return (income - 18200) * 0.16;
  if (income <= 135000) return 4288 + (income - 45000) * 0.30;
  if (income <= 190000) return 31288 + (income - 135000) * 0.37;
  return 51638 + (income - 190000) * 0.45;
}

function calculateLITO(income) {
  if (income <= 37500) return 700;
  if (income <= 45000) return 700 - (income - 37500) * 0.05;
  if (income <= 66667) return 325 - (income - 45000) * 0.015;
  return 0;
}

function calculateMedicare(income) {
  const threshold = 26000;
  if (income <= threshold) return 0;
  if (income <= threshold * 1.25) return (income - threshold) * 0.10;
  return income * 0.02;
}

function calculate() {
  let income = parseFloat(document.getElementById("income").value) || 0;

  let tax = calculateTax(income);
  let lito = calculateLITO(income);
  let medicare = calculateMedicare(income);

  let totalTax = Math.max(0, tax - lito);
  let total = totalTax + medicare;
  let net = income - total;

  function format(x) {
    return "$" + Math.round(x).toLocaleString();
  }

  document.getElementById("tax").innerText = format(totalTax);
  document.getElementById("medicare").innerText = format(medicare);
  document.getElementById("total").innerText = format(total);
  document.getElementById("net").innerText = format(net);

  document.getElementById("monthly").innerText = format(net / 12);
  document.getElementById("weekly").innerText = format(net / 52);

  let rate = income > 0 ? (total / income) * 100 : 0;
  document.getElementById("rate").innerText = rate.toFixed(1) + "%";

  renderChart(net, total);
}

function renderChart(net, tax) {
  const ctx = document.getElementById("chart").getContext("2d");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Income Breakdown"],
      datasets: [
        {
          label: "Net Income",
          data: [net],
          borderWidth: 1
        },
        {
          label: "Tax + Medicare",
          data: [tax],
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: "top"
        }
      },
      scales: {
        x: {
          stacked: true
        },
        y: {
          stacked: true,
          ticks: {
            callback: value => "$" + value.toLocaleString()
          }
        }
      }
    }
  });
}

document.getElementById("income").addEventListener("input", calculate);

calculate();
</script>

</body>
</html>
