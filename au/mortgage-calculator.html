<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mortgage Calculator Australia (2026) | Numeroxa</title>

<style>
body {margin:0;font-family:Arial;background:#f9fafb;}
header {background:#0f172a;color:white;padding:20px;}
.container {max-width:900px;margin:auto;padding:40px 20px;}
.grid {display:grid;grid-template-columns:1fr 1fr;gap:20px;}
input {width:100%;padding:10px;}
.result {margin-top:20px;background:#f1f5f9;padding:20px;border-radius:10px;}
section {margin-top:50px;}
</style>
</head>

<body>
<header>Numeroxa — Smart Financial Calculators</header>

<div class="container">
<h1>Mortgage Calculator</h1>

<div class="grid">
<input id="loan" value="600000">
<input id="rate" value="6">
<input id="years" value="30">
<input id="extra" value="0">
</div>

<div class="result">
<div id="monthly"></div>
<div id="interest"></div>
</div>

<!-- RELATED -->
<div style="margin-top:30px;background:#eef2ff;padding:20px;border-radius:10px;">
<b>Related calculators:</b>
<ul>
<li><a href="compound-interest.html">Compound interest calculator</a></li>
<li><a href="savings-goal.html">Savings goal calculator</a></li>
<li><a href="tax-calculator.html">Tax calculator</a></li>
</ul>
</div>

<section>
<h2>How mortgage repayments work</h2>
<p>Mortgage repayments consist of principal and interest...</p>
</section>

</div>

<script>
function calc(){
let P=loan.value,r=rate.value/100/12,n=years.value*12;
let m=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
monthly.innerText="$"+Math.round(m);
}
document.querySelectorAll("input").forEach(i=>i.oninput=calc);
calc();
</script>
</body>
</html>
