<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mortgage Calculator Australia (2026) | Numeroxa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Inter, Arial;
  background: #f9fafb;
  color: #111;
}

header {
  background:#0f172a;
  color:white;
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
}

header a {
  color:white;
  text-decoration:none;
  margin-left:20px;
}

.container {
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

input {
  width:100%;
  padding:10px;
  border-radius:6px;
  border:1px solid #ddd;
}

.result {
  margin-top:30px;
  padding:25px;
  background:white;
  border-radius:12px;
}

.big {font-size:28px;font-weight:bold;}

canvas {margin-top:30px;}

table {
  width:100%;
  margin-top:30px;
  border-collapse:collapse;
}

td, th {
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:left;
}
</style>
</head>

<body>

<header>
<a href="../index.html">Numeroxa</a>
<div>
<a href="../index.html">Home</a>
<a href="compound-interest.html">Compound</a>
<a href="savings-goal.html">Savings</a>
<a href="tax-calculator.html">Tax</a>
</div>
</header>

<div class="container">

<h1>Mortgage Calculator</h1>

<div class="grid">
<input id="loan" value="600000">
<input id="rate" value="6">
<input id="years" value="30">
<input id="extra" value="0">
</div>

<div class="result">
<div class="big" id="monthly"></div>
<div id="interest"></div>
<div id="duration"></div>
</div>

<canvas id="chart"></canvas>

<table id="table">
<thead>
<tr>
<th>Year</th>
<th>Balance</th>
<th>Interest Paid</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let chart;

function calc(){
let P=+loan.value;
let r=rate.value/100/12;
let n=years.value*12;
let extraVal=+extra.value||0;

let balance=P;
let totalInterest=0;
let data=[],labels=[];
let table="";

for(let i=1;i<=n;i++){
let interest=balance*r;
let payment=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)+extraVal;
balance=balance+interest-payment;
totalInterest+=interest;

if(i%12===0){
labels.push("Year "+i/12);
data.push(balance);

table+=`<tr>
<td>${i/12}</td>
<td>$${Math.round(balance).toLocaleString()}</td>
<td>$${Math.round(totalInterest).toLocaleString()}</td>
</tr>`;
}
}

monthly.innerText="$"+Math.round((P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1))+extraVal);
interest.innerText="Total interest: $"+Math.round(totalInterest).toLocaleString();
duration.innerText="Duration: "+years.value+" years";

document.querySelector("#table tbody").innerHTML=table;

if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{labels,datasets:[{label:"Balance",data}]}
});
}

document.querySelectorAll("input").forEach(i=>i.oninput=calc);
calc();
</script>

</div>
</body>
</html>
