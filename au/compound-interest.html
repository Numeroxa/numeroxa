<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compound Interest Calculator Australia (2026) | Numeroxa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0;font-family:Inter, Arial;background:#f9fafb;color:#111;}
header {background:#0f172a;color:white;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;}
header a {color:white;text-decoration:none;margin-left:20px;}
.logo {font-size:20px;font-weight:600;}
.tagline {display:block;font-size:11px;opacity:0.7;}
.container {max-width:1000px;margin:auto;padding:40px 20px;}
.grid {display:grid;grid-template-columns:1fr 1fr;gap:20px;}
input {width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;}
.result {margin-top:30px;background:white;padding:25px;border-radius:12px;}
.big {font-size:28px;font-weight:bold;}
canvas {margin-top:30px;}
</style>
</head>

<body>

<header>
<a href="../index.html" class="logo">Numeroxa<span class="tagline">Smart Financial Calculators</span></a>
<div>
<a href="../index.html">Home</a>
<a href="mortgage-calculator.html">Mortgage</a>
<a href="savings-goal.html">Savings</a>
<a href="tax-calculator.html">Tax</a>
</div>
</header>

<div class="container">

<h1>Compound Interest Calculator</h1>

<div class="grid">
<input id="principal" value="10000">
<input id="monthly" value="500">
<input id="rate" value="7">
<input id="years" value="20">
</div>

<div class="result">
<div class="big" id="final"></div>
<div id="contributions"></div>
<div id="interest"></div>
</div>

<canvas id="chart"></canvas>

<script>
let chart;

function calculate(){

let P=+principal.value;
let PMT=+monthly.value;
let r=rate.value/100/12;
let n=years.value*12;

let balance=P;
let totalContrib=P;

let labels=[],contribData=[],interestData=[];

for(let i=0;i<=n;i++){
if(i%12===0){
labels.push("Year "+i/12);
contribData.push(totalContrib);
interestData.push(balance-totalContrib);
}
balance=balance*(1+r)+PMT;
totalContrib+=PMT;
}

function f(x){return "$"+Math.round(x).toLocaleString();}

final.innerText=f(balance);
contributions.innerText="Contributions: "+f(totalContrib);
interest.innerText="Interest: "+f(balance-totalContrib);

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:labels,
datasets:[
{
label:"Contributions",
data:contribData,
fill:true,
tension:0.3,
backgroundColor:"rgba(37,99,235,0.2)",
borderColor:"rgba(37,99,235,1)"
},
{
label:"Interest",
data:interestData,
fill:true,
tension:0.3,
backgroundColor:"rgba(236,72,153,0.2)",
borderColor:"rgba(236,72,153,1)"
}
]
},
options:{
responsive:true,
interaction:{mode:"index",intersect:false},
scales:{y:{stacked:true}}
}
});
}

document.querySelectorAll("input").forEach(i=>i.oninput=calculate);
calculate();
</script>

</div>
</body>
</html>
