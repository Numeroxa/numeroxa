<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compound Interest Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<h1>Compound Interest Calculator</h1>

<input id="p" value="10000">
<input id="m" value="500">
<input id="r" value="7">
<input id="y" value="20">

<div id="result"></div>
<canvas id="chart"></canvas>

<!-- RELATED -->
<div>
<b>Related calculators:</b>
<ul>
<li><a href="mortgage-calculator.html">Mortgage</a></li>
<li><a href="savings-goal.html">Savings goal</a></li>
<li><a href="tax-calculator.html">Tax calculator</a></li>
</ul>
</div>

<section>
<h2>What is compound interest?</h2>
<p>Compound interest allows exponential growth over time.</p>
</section>

<script>
let chart;
function calc(){
let P=+p.value,PMT=+m.value,rte=r.value/100/12,n=y.value*12;
let bal=P,data=[],labels=[];
for(let i=0;i<n;i++){
bal=bal*(1+rte)+PMT;
if(i%12===0){data.push(bal);labels.push(i/12);}
}
result.innerText="$"+Math.round(bal).toLocaleString();

if(chart)chart.destroy();
chart=new Chart(chart,{type:'line',data:{labels,datasets:[{data}]}})
}
document.querySelectorAll("input").forEach(i=>i.oninput=calc);
calc();
</script>
</body>
</html>
