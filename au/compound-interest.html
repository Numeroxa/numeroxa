<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Compound Interest Calculator Australia (2026) | Numeroxa</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f9fafb;
      color: #111;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px 40px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .calculator {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .big {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .highlight {
      margin-top: 15px;
      padding: 15px;
      background: #d1fae5;
      border-radius: 8px;
      font-weight: bold;
    }

    canvas {
      margin-top: 30px;
    }

    @media(max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  Numeroxa — Smart Financial Calculators
</header>

<div class="container">

  <h1>Compound Interest Calculator</h1>

  <div class="calculator">

    <div class="grid">
      <div>
        <label>Initial Investment ($)</label>
        <input id="principal" type="number" value="10000">
      </div>

      <div>
        <label>Monthly Contribution ($)</label>
        <input id="monthly" type="number" value="500">
      </div>

      <div>
        <label>Interest Rate (% p.a.)</label>
        <input id="rate" type="number" value="7" step="0.01">
      </div>

      <div>
        <label>Time Period (years)</label>
        <input id="years" type="number" value="20">
      </div>
    </div>

    <div class="result">
      <div>Final balance</div>
      <div class="big" id="final"></div>

      <div>Total contributions</div>
      <div id="contributions"></div>

      <div>Interest earned</div>
      <div id="interest"></div>

      <div class="highlight" id="growth"></div>
    </div>

    <canvas id="chart"></canvas>

  </div>

</div>

<script>
let chart;

function calculate() {
  let P = parseFloat(document.getElementById("principal").value) || 0;
  let PMT = parseFloat(document.getElementById("monthly").value) || 0;
  let r = parseFloat(document.getElementById("rate").value) / 100 / 12;
  let years = parseFloat(document.getElementById("years").value);
  let n = years * 12;

  let balance = P;
  let totalContrib = P;

  let labels = [];
  let contributionData = [];
  let interestData = [];

  for (let i = 0; i <= n; i++) {

    if (i % 12 === 0) {
      let interest = balance - totalContrib;

      labels.push("Year " + (i / 12));
      contributionData.push(totalContrib);
      interestData.push(interest);
    }

    balance = balance * (1 + r) + PMT;
    totalContrib += PMT;
  }

  let finalBalance = balance;
  let contributions = totalContrib;
  let interest = finalBalance - contributions;

  function format(x) {
    return "$" + Math.round(x).toLocaleString();
  }

  document.getElementById("final").innerText = format(finalBalance);
  document.getElementById("contributions").innerText = format(contributions);
  document.getElementById("interest").innerText = format(interest);

  document.getElementById("growth").innerText =
    interest > 0
      ? "Your money grows by " + format(interest) + " from compound interest"
      : "";

  renderChart(labels, contributionData, interestData);
}

function renderChart(labels, contributions, interest) {
  const ctx = document.getElementById("chart").getContext("2d");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        {
          label: "Contributions",
          data: contributions,
          fill: true,
          borderWidth: 1
        },
        {
          label: "Interest",
          data: interest,
          fill: true,
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      interaction: {
        mode: "index",
        intersect: false
      },
      stacked: true,
      plugins: {
        legend: {
          position: "top"
        }
      },
      scales: {
        y: {
          stacked: true,
          ticks: {
            callback: value => "$" + value.toLocaleString()
          }
        }
      }
    }
  });
}

document.querySelectorAll("input").forEach(el => {
  el.addEventListener("input", calculate);
});

calculate();
</script>

</body>
</html>
