<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compound Interest Calculator | Numeroxa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#f9fafb;margin:0;padding:40px;}
canvas{margin-top:30px;}
</style>
</head>

<body>

<h1>Compound Interest Calculator</h1>

<input id="p" value="10000">
<input id="m" value="500">
<input id="r" value="7">
<input id="y" value="20">

<div id="final"></div>
<canvas id="chart"></canvas>

<!-- RELATED -->
<div style="margin-top:40px;background:#eef2ff;padding:20px;border-radius:10px;">
<strong>Related calculators:</strong>
<ul>
<li><a href="mortgage-calculator.html">Mortgage calculator</a></li>
<li><a href="savings-goal.html">Savings goal</a></li>
<li><a href="tax-calculator.html">Tax calculator</a></li>
</ul>
</div>

<section>
<h2>What is compound interest?</h2>
<p>Compound interest grows your money exponentially by earning returns on both principal and accumulated interest.</p>
</section>

<script>
let chart;

function calc(){
let P=+p.value,PMT=+m.value,rte=r.value/100/12,n=y.value*12;
let bal=P,labels=[],data=[];

for(let i=0;i<=n;i++){
if(i%12===0){labels.push(i/12);data.push(bal);}
bal=bal*(1+rte)+PMT;
}

final.innerText="$"+Math.round(bal).toLocaleString();

if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{labels,datasets:[{label:"Balance",data,fill:true}]}
});
}
document.querySelectorAll("input").forEach(i=>i.oninput=calc);
calc();
</script>

</body>
</html>
